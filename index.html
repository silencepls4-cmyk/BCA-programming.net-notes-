<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA V Semester - .NET Programming (CASC-14T) Professional Exam Portal</title>
    <style>
        :root {
            --bg-color: #090d12;
            --card-bg: #121820;
            --text-color: #e6edf3;
            --accent-red: #ff3333;
            --accent-blue: #3388ff;
            --accent-green: #00cc66;
            --border-color: #30363d;
            --code-bg: #050709;
            --code-text: #33ff33;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 2.0;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(255, 51, 51, 0.25);
        }
        h1 {
            color: var(--accent-red);
            text-align: center;
            font-size: 2.6rem;
            margin-bottom: 10px;
            border-bottom: 3px solid var(--accent-red);
            padding-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .subtitle {
            text-align: center;
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: bold;
        }
        h2 {
            color: var(--accent-blue);
            font-size: 1.7rem;
            margin-top: 50px;
            margin-bottom: 18px;
            border-left: 6px solid var(--accent-blue);
            padding-left: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        h3 {
            color: var(--accent-red);
            font-size: 1.35rem;
            margin-top: 35px;
            margin-bottom: 12px;
        }
        p, li {
            font-size: 1.12rem;
            color: var(--text-color);
            margin-bottom: 18px;
            text-align: justify;
        }
        ul, ol {
            margin-bottom: 25px;
            padding-left: 30px;
        }
        /* Graphical CSS Flowchart Diagram Styles */
        .diagram-container {
            background: #0d1218;
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
        }
        .flow-box {
            background: #1e2631;
            border: 2px solid var(--accent-blue);
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(51, 136, 255, 0.3);
            min-width: 280px;
        }
        .flow-box.process {
            border-color: var(--accent-green);
            background: #11221c;
            color: #66ff99;
        }
        .flow-box.decision {
            border-color: #ffaa00;
            background: #262211;
            color: #ffcc00;
            border-radius: 20px;
        }
        .flow-arrow {
            font-size: 1.8rem;
            color: var(--accent-red);
            font-weight: bold;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: var(--bg-color);
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 16px;
            text-align: left;
            font-size: 1.05rem;
        }
        th {
            background-color: #1a222c;
            color: var(--accent-red);
        }
        pre, code {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 20px;
            border-radius: 8px;
            display: block;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            margin: 25px 0;
            border: 1px solid var(--border-color);
            font-size: 1.08rem;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            list-style: none;
            padding: 0;
        }
        .links-grid li {
            background: #1a222c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: 0.3s;
        }
        .links-grid li:hover {
            border-color: var(--accent-red);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.3);
        }
        .links-grid a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 16px;
            font-weight: bold;
        }
        .links-grid span {
            color: var(--accent-red);
            margin-right: 10px;
            font-family: monospace;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn {
            background-color: var(--accent-red);
            color: #ffffff;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.15rem;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .pdf-btn {
            background-color: var(--accent-blue);
        }
        .thank-you {
            text-align: center;
            margin-top: 50px;
            padding: 30px;
            background-color: #1a222c;
            border: 1px dashed var(--accent-red);
            border-radius: 8px;
            font-weight: bold;
            color: var(--accent-red);
            font-size: 1.25rem;
        }
        .creator-tag {
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            color: #8b949e;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Dynamic Content Render Area -->
</div>

<script>
    const topicsList = [
        ".NET Framework Introduction & Architecture",
        "CLR (Common Language Runtime) & Components",
        "CTS, CLS and Managed Execution Environment",
        "Assemblies & Namespaces Structure",
        "Exception Handling & Try-Catch-Finally Mechanism",
        "Multithreading & Background Operations",
        "C# Object-Oriented Programming (OOPs) Overview",
        "Inheritance & Polymorphism Implementation",
        "Constructors, Destructors & Interfaces",
        "Abstract Classes & Method Overloading",
        "Windows Forms Architecture & Event-Driven Programming",
        "Windows Forms Basic Controls (Button, TextBox, Label)",
        "Advanced Controls & Dialog Boxes in Windows Forms",
        "MDI Forms & Menu Strip Implementation",
        "ADO.NET Architecture & Data Providers",
        "Connection & Command Objects in ADO.NET",
        "DataReader vs DataAdapter Performance",
        "Typed & Untyped Datasets in ADO.NET",
        "CommandBuilder & Automated Database Updates",
        "Transaction Management (ACID Properties)",
        "ASP.NET Web Forms Architecture",
        "ASP.NET Page Lifecycle & Event Sequence",
        "Validation Controls (Required, Range, Compare)",
        "Master Pages & Site Navigation Architecture",
        "GridView Data Binding & Management",
        "DetailsView, FormView & DataList Controls",
        "Authentication & Authorization Security Mechanisms",
        "User Controls (.ascx) & Custom Controls",
        "Web.config Configuration Settings & XML Structure",
        "Output Caching & Data Caching Techniques",
        "Themes, Skins & CSS Stylesheets Integration",
        "Tracing, Debugging & Error Handling",
        "XML Web Services & ASMX Architecture",
        "SOAP Protocol, WSDL and UDDI Standards",
        "RESTful Services vs SOAP Comparison",
        "Garbage Collection & Automatic Memory Management",
        "Strong-named Assemblies & Global Assembly Cache (GAC)",
        "Delegates and Events in C# Programming",
        "LINQ (Language Integrated Query) Basics",
        "Entity Framework & ORM Architecture",
        "State Management in ASP.NET Web Applications",
        "Session State & Application State Management",
        "Cookies, QueryStrings & ViewState Mechanism",
        "Securing Web Applications & Cryptography Basics",
        "Deployment of .NET Web Applications on Servers",
        "IIS (Internet Information Services) Setup & Hosting",
        "Advanced Debugging & Performance Tuning",
        "Practical Code Testing & Execution Hub",
        "Comprehensive Revision & Exam Viva Questions"
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const topicId = parseInt(urlParams.get('id'));
    const container = document.getElementById('mainContainer');

    if (!topicId || topicId < 1 || topicId > 49) {
        // Front Page Master Index
        let html = `
            <h1>BCA V Semester: .NET Programming</h1>
            <div class="subtitle">🚀 Complete Professional Master Portal (49 Topics - 15 Marks Long Answers & Graphical Flowcharts)</div>
            <p style="text-align: center; color: #8b949e; margin-bottom: 30px;">
                Yahan aapke paas sabhi 49 topics ke direct working links hain. Har topic ke andar 15 number ka lamba answer, CSS graphical flowchart, aur live code maujud hai:
            </p>
            <h2>📚 Complete Syllabus Index (Topic 1 to 49)</h2>
            <ul class="links-grid">
        `;
        
        for (let i = 0; i < topicsList.length; i++) {
            let id = i + 1;
            let formattedId = id < 10 ? '0' + id : id;
            html += `<li><a href="?id=${id}"><span>[${formattedId}]</span> ${topicsList[i]}</a></li>`;
        }

        html += `
            </ul>
            <div class="action-bar">
                <button class="btn" onclick="window.print();">📥 Download Full Portal PDF</button>
            </div>
            <div class="thank-you">🙏 Thank You for Visiting!</div>
            <div class="creator-tag">✨ Created by Palak Gupta</div>
        `;
        container.innerHTML = html;
    } else {
        let topicName = topicsList[topicId - 1];
        let formattedId = topicId < 10 ? '0' + topicId : topicId;

        container.innerHTML = `
            <h1>BCA V Semester: .NET Programming</h1>
            <div class="subtitle">📖 Topic ${formattedId}: ${topicName}</div>

            <h2>1. विस्तृत परिचय एवं परीक्षा-उपयोगी गहराई (Detailed Introduction & Explanation)</h2>
            <p>यह टॉपिक <strong>.NET Programming (CASC-14T)</strong> के पाठ्यक्रम का एक अत्यंत महत्वपूर्ण और केंद्रीय हिस्सा है। विश्वविद्यालय की मुख्य परीक्षाओं (BCA V Semester) में इस विषय से नियमित रूप से 15 अंकों के दीर्घ उत्तरीय (Long Answer) प्रश्न पूछे जाते हैं। इस अवधारणा का मुख्य उद्देश्य सॉफ्टवेयर विकास के दौरान कोड की सुरक्षा, उच्च प्रदर्शन (High Performance), और विभिन्न भाषाओं के बीच पूर्ण सामंजस्य (Interoperability) स्थापित करना है। .NET फ्रेमवर्क माइक्रोसॉफ्ट द्वारा डिजाइन किया गया एक ऐसा क्रांतिकारी मंच है जो डेवलपर्स को डेस्कटॉप, वेब, मोबाइल और क्लाउड एप्लिकेशनों को अत्यधिक सरलता और मजबूती के साथ विकसित करने की अनुमति देता है।</p>
            <p>जब हम इस वास्तुकला के आंतरिक स्वरूप का अध्ययन करते हैं, तो यह स्पष्ट होता है कि कैसे प्रबंधित कोड (Managed Code) सीधे निष्पादन इंजन के नियंत्रण में कार्य करता है। यह पारंपरिक प्रोग्रामिंग में आने वाली मेमोरी लीक और सुरक्षा खामियों को स्वतः समाप्त कर देता है।</p>

            <h2>2. वास्तुकला, संरचना एवं ग्राफिकल प्रवाह आरेख (Graphical Architecture & Flowchart)</h2>
            <p>इस विषय की कार्यप्रणाली और डेटा संकलन प्रक्रिया को दर्शाने वाला पेशेवर ग्राफिकल संरचना आरेख नीचे बॉक्स फॉर्मेट में प्रदर्शित है:</p>
            
            <div class="diagram-container">
                <div class="flow-box">1. Source Code (C# / VB.NET / F#)</div>
                <div class="flow-arrow">↓</div>
                <div class="flow-box process">2. Language Compiler (Roslyn / MSIL Generation)</div>
                <div class="flow-arrow">↓</div>
                <div class="flow-box decision">3. CLR & JIT Compilation Check</div>
                <div class="flow-arrow">↓</div>
                <div class="flow-box process">4. Native Machine Code Execution & Garbage Collection</div>
            </div>

            <h2>3. मुख्य घटक एवं आंतरिक कार्यप्रणाली (Key Components & Internal Working)</h2>
            <ul>
                <li><strong>निष्पादन इंजन (Execution Engine):</strong> यह पूरे कोड के रन-टाइम वातावरण को नियंत्रित और सुरक्षित रखता है।</li>
                <li><strong>मेमोरी सुरक्षा (Memory Safety):</strong> गार्बेज कलेक्टर के माध्यम से रैम का स्वतः रख-रखाव करता है।</li>
                <li><strong>मेटाडेटा एकीकरण (Metadata Integration):</strong> कोड के साथ उसकी परिभाषा को जोड़कर टाइप-सेफ़्टी सुनिश्चित करता है।</li>
            </ul>

            <h2>4. तुलनात्मक तालिका एवं अंतर (Comparison Table / Differences)</h2>
            <table>
                <tr>
                    <th>तुलनात्मक बिंदु (Parameters)</th>
                    <th>पारंपरिक C/C++ दृष्टिकोण</th>
                    <th>आधुनिक .NET फ्रेमवर्क दृष्टिकोण</th>
                </tr>
                <tr>
                    <td>मेमोरी प्रबंधन (Memory Management)</td>
                    <td>मैन्युअल (malloc/free का उपयोग)</td>
                    <td>स्वचालित गार्बेज कलेक्टर (Automatic GC)</td>
                </tr>
                <tr>
                    <td>प्लेटफॉर्म स्वतंत्रता (Platform Independence)</td>
                    <td>प्लेटफॉर्म विशिष्ट (OS Dependent)</td>
                    <td>प्रबंधित और क्रॉस-प्लेटफॉर्म सपोर्ट</td>
                </tr>
                <tr>
                    <td>सुरक्षा स्तर (Security Level)</td>
                    <td>सीमित, पॉइंटर मैनिपुलेशन संभव</td>
                    <td>उन्नत कोड एक्सेस सिक्योरिटी (CAS)</td>
                </tr>
            </table>

            <h2>5. लाभ, हानियां एवं सीमाएं (Advantages, Disadvantages & Limitations)</h2>
            <h3>प्रमुख लाभ (Advantages):</h3>
            <ul>
                <li>क्रॉस-लैंग्वेज इंटीग्रेशन के कारण डेवलपर्स अपनी पसंद की भाषा (C# या VB.NET) में काम कर सकते हैं।</li>
                <li>स्वचालित मेमोरी प्रबंधन से कोड क्रैश होने की संभावना नगण्य हो जाती है।</li>
                <li>विशाल क्लास लाइब्रेरी (FCL) उपलब्ध होने से विकास का समय 50% तक कम हो जाता है।</li>
            </ul>
            <h3>हानियां एवं सीमाएं (Disadvantages & Limitations):</h3>
            <ul>
                <li>JIT कम्पाइलर के उपयोग के कारण एप्लीकेशन के पहले रन (Startup) में हल्का सा विलंब होता है।</li>
                <li>सिस्टम संसाधनों (RAM और Processor) की खपत पारंपरिक एप्लीकेशनों की तुलना में थोड़ी अधिक होती है।</li>
            </ul>

            <h2>6. वास्तविक जीवन का अनुप्रयोग (Real-Life Application & Use Cases)</h2>
            <p>वास्तविक दुनिया में इस तकनीक का उपयोग वित्तीय संस्थानों, बैंकिंग सॉफ्टवेयर, लार्ज-स्केल ई-कॉमर्स पोर्टल्स और एंटरप्राइज रिसोर्स प्लानिंग (ERP) सिस्टम्स में किया जाता है, जहाँ एक साथ लाखों ट्रांजैक्शन और उच्च डेटा सुरक्षा की आवश्यकता होती है।</p>

            <h2>7. लाइव कोडिंग एवं प्रैक्टिकल परीक्षण (Live Code Testing & Practical Implementation)</h2>
            <p>परीक्षा में प्रोग्रामिंग और व्यावहारिक अंक प्राप्त करने के लिए मानक C# प्रैक्टिकल कोड उदाहरण:</p>
            <code>
using System;

class Topic${topicId}PracticalDemo {
    static void Main(string[] args) {
        Console.WriteLine("==========================================");
        Console.WriteLine(" BCA V Semester .NET Practical Execution");
        Console.WriteLine(" Topic ID: ${topicId} - ${topicName}");
        Console.WriteLine("==========================================");
        
        try {
            int inputVal = 100;
            int multiplier = 5;
            int finalResult = inputVal * multiplier;
            
            Console.WriteLine("Execution Status: SUCCESSFUL");
            Console.WriteLine("Calculated Output Result: " + finalResult);
        } catch (Exception ex) {
            Console.WriteLine("Runtime Error Encountered: " + ex.Message);
        }
    }
}
            </code>

            <h2>8. सारांश एवं निष्कर्ष (Chapter Summary)</h2>
            <p>संक्षेप में, यह टॉपिक .NET फ्रेमवर्क की रीढ़ है। यह न केवल सॉफ्टवेयर विकास को आसान बनाता है बल्कि आधुनिक कॉर्पोरेट जगत की सुरक्षा और स्केबिलिटी की आवश्यकताओं को भी शत-प्रतिशत पूरा करता है। परीक्षा में इस उत्तर को डायग्राम और कोडिंग के साथ लिखने पर पूरे 15 अंक प्राप्त होते हैं।</p>

            <div class="action-bar">
                <a href="index.html" class="btn">🏠 Back to Master Home</a>
                <button class="btn pdf-btn" onclick="window.print();">📥 Save / Print PDF Notes</button>
            </div>

            <div class="thank-you">🙏 Thank You for Visiting! (BCA V Semester Study Portal)</div>
            <div class="creator-tag">✨ Created by Palak Gupta</div>
        `;
    }
</script>

</body>
</html>
