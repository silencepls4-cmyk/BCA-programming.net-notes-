<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA V Semester - CASC-14T .NET Programming Master Portal</title>
    <style>
        :root {
            --bg-color: #05070b;
            --card-bg: #0d1117;
            --text-color: #e6edf3;
            --accent-red: #ff334b;
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --border-color: #21262d;
            --code-bg: #020408;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.9;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        h1 {
            color: var(--accent-cyan);
            text-align: center;
            font-size: 2.3rem;
            margin-bottom: 10px;
            border-bottom: 3px solid var(--accent-cyan);
            padding-bottom: 15px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            font-size: 1.15rem;
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: bold;
        }
        h2 {
            color: var(--accent-red);
            font-size: 1.6rem;
            margin-top: 40px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent-red);
            padding-left: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        p, li {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 15px;
            text-align: justify;
        }
        ul, ol {
            margin-bottom: 20px;
            padding-left: 25px;
        }
        .diagram-container {
            background: #080c10;
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 25px;
            margin: 25px 0;
            text-align: center;
        }
        .flow-box {
            background: #111822;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 14px 24px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
            font-size: 1.05rem;
            min-width: 280px;
        }
        .flow-box.process {
            border-color: var(--accent-green);
            background: #0b1a12;
            color: var(--accent-green);
        }
        .flow-arrow {
            font-size: 1.5rem;
            color: var(--accent-red);
            font-weight: bold;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            background: var(--bg-color);
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: left;
            font-size: 1rem;
        }
        th {
            background-color: #161b22;
            color: var(--accent-cyan);
        }
        pre, code {
            background: var(--code-bg);
            color: var(--accent-green);
            padding: 18px;
            border-radius: 6px;
            display: block;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px 0;
            border: 1px solid var(--border-color);
            font-size: 1.05rem;
        }
        .unit-title {
            color: var(--accent-green);
            font-size: 1.4rem;
            margin-top: 35px;
            margin-bottom: 12px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 6px;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 12px;
            list-style: none;
            padding: 0;
        }
        .links-grid li {
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: 0.3s;
        }
        .links-grid li:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }
        .links-grid a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 15px;
            font-weight: bold;
            font-size: 1.02rem;
        }
        .links-grid span {
            color: var(--accent-cyan);
            margin-right: 8px;
            font-family: monospace;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding-top: 25px;
            border-top: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn {
            background-color: var(--accent-red);
            color: #ffffff;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            display: inline-block;
            box-shadow: 0 0 12px rgba(255, 51, 75, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #cc2238;
        }
        .pdf-btn {
            background-color: var(--accent-cyan);
            color: #05070b;
        }
        .qa-box {
            background: #080e14;
            border-left: 5px solid var(--accent-green);
            padding: 20px;
            margin: 25px 0;
            border-radius: 6px;
        }
        .qa-box h4 {
            color: var(--accent-green);
            font-size: 1.15rem;
            margin-top: 0;
        }
        .thank-you {
            text-align: center;
            margin-top: 40px;
            padding: 25px;
            background-color: #161b22;
            border: 1px dashed var(--accent-cyan);
            border-radius: 6px;
            font-weight: bold;
            color: var(--accent-cyan);
            font-size: 1.15rem;
        }
        .creator-tag {
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #8b949e;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Portal Content Renders Here -->
</div>

<script>
    // Official Syllabus Topics Array (Sant Gahira Guru Vishwavidyalaya - CASC-14T)
    const syllabus = [
        { unit: "UNIT I", title: "Overview of .NET Framework, Features and Architecture" },
        { unit: "UNIT I", title: "Managed Execution Process & Common Language Runtime (CLR)" },
        { unit: "UNIT I", title: "Common Language Specification (CLS) and Common Type System (CTS)" },
        { unit: "UNIT I", title: "JIT Compilation & MSIL (Microsoft Intermediate Language)" },
        { unit: "UNIT I", title: "Namespaces, Assemblies and Metadata in .NET" },
        { unit: "UNIT I", title: "System Namespace, Core Classes and Framework Libraries" },
        { unit: "UNIT I", title: "Visual Development and Event-Driven Programming Paradigm" },
        { unit: "UNIT I", title: "Cross-Language Interoperability and Managed Environment" },
        { unit: "UNIT I", title: "Garbage Collection and Automatic Memory Management" },
        { unit: "UNIT I", title: "Framework Security, Code Access Security (CAS) & Version Evolution" },

        { unit: "UNIT II", title: "Programming with .NET Framework & Visual Studio IDE" },
        { unit: "UNIT II", title: "Working with Windows Forms and GUI Architecture" },
        { unit: "UNIT II", title: "Creating .NET Solutions and MDI Applications" },
        { unit: "UNIT II", title: "Components, Toolbox Controls and Properties Management" },
        { unit: "UNIT II", title: "Variables, Data Types, Scope and Lifetime of Variables" },
        { unit: "UNIT II", title: "Type Conversions (Implicit & Explicit) and Operators" },
        { unit: "UNIT II", title: "Methods, Functions, Parameters and Method Overloading" },
        { unit: "UNIT II", title: "Event Handling Mechanisms in Windows Forms" },
        { unit: "UNIT II", title: "Creating and Using Enumerations (Enums) and Structures" },
        { unit: "UNIT II", title: "Object-Oriented Programming (OOPs) Principles in .NET" },

        { unit: "UNIT III", title: "Control Structures: Conditional Statements (If, Select Case)" },
        { unit: "UNIT III", title: "Iteration Statements, Loops and Arrays in .NET" },
        { unit: "UNIT III", title: "Sub Procedures, Functions and Return Values" },
        { unit: "UNIT III", title: "Exception Handling: Try, Catch, Finally and Throw Statements" },
        { unit: "UNIT III", title: "User-Defined Exceptions and Error Management Best Practices" },
        { unit: "UNIT III", title: "GUI Programming: Window Forms Setup, Showing & Hiding Forms" },
        { unit: "UNIT III", title: "Basic GUI Controls: Textbox, RichTextBox, Label and Button" },
        { unit: "UNIT III", title: "Selection Controls: CheckBox, RadioButton, Toggle Button" },
        { unit: "UNIT III", title: "Container Controls: Panel, GroupBox, Splitter and Scrollbar" },
        { unit: "UNIT III", title: "Advanced Controls: Timer, PictureBox, ImageList and Tooltips" },
        { unit: "UNIT III", title: "File Dialogs: OpenFileDialog, SaveFileDialog and PrintDialog" },
        { unit: "UNIT III", title: "Dialog Boxes: ColorDialog, FontDialog and Custom Dialogs" },
        { unit: "UNIT III", title: "Designing Menus, Sub-Menus, Context Menus and ToolStrips" },
        { unit: "UNIT III", title: "Message Boxes (MsgBox) and Input Boxes (InputBox) Implementation" },

        { unit: "UNIT IV", title: "Database Programming with ADO.NET Architecture" },
        { unit: "UNIT IV", title: "ADO.NET Data Providers (SqlClient, OleDb) and Core Components" },
        { unit: "UNIT IV", title: "Creating Database Applications using Windows Forms GUI" },
        { unit: "UNIT IV", title: "Database Connectivity, Connection Strings & Connection Management" },
        { unit: "UNIT IV", title: "Accessing Data using Server Explorer and Data Adapters" },
        { unit: "UNIT IV", title: "Datasets, Data Tables, Data Rows and Data Relations" },
        { unit: "UNIT IV", title: "Command Objects (SqlCommand) and SqlDataReader Operations" },
        { unit: "UNIT IV", title: "Data Binding Controls & Displaying Data in DataGrid / GridView" },
        { unit: "UNIT IV", title: "Connected vs Disconnected Data Access Architecture Deep Dive" },
        { unit: "UNIT IV", title: "Executing Stored Procedures, Parameters and Transactions" },
        { unit: "UNIT IV", title: "CommandBuilder and Automated Database Insert/Update/Delete" },
        { unit: "UNIT IV", title: "Handling Concurrency Conflicts and Database Exceptions" },
        { unit: "UNIT IV", title: "XML Data Integration and Serialization with ADO.NET Datasets" },
        { unit: "UNIT IV", title: "Security, Authentication & Authorization in Database Connectivity" },
        { unit: "UNIT IV", title: "Comprehensive Course Review, Reference Books, Viva & Important Questions" }
    ];

    const container = document.getElementById('mainContainer');

    function renderPage() {
        let hash = window.location.hash.replace('#topic', '');
        let topicId = parseInt(hash);

        if (!topicId || isNaN(topicId) || topicId < 1 || topicId > syllabus.length) {
            // Render Index Page
            let html = `
                <h1>BCA V Semester: .NET Programming (CASC-14T)</h1>
                <div class="subtitle">📚 Official Syllabus Master Portal // Sant Gahira Guru Vishwavidyalaya[span_0](start_span)[span_0](end_span)</div>
                <p style="text-align: center; color: #8b949e; margin-bottom: 25px;">
                    Neeche diye gaye kisi bhi topic par click karein. Yeh turant 15-number ke long answer, graphical flowchart aur code ke sath khul jayega:
                </p>
            `;

            let currentUnit = "";
            for (let i = 0; i < syllabus.length; i++) {
                let id = i + 1;
                let item = syllabus[i];
                if (item.unit !== currentUnit) {
                    currentUnit = item.unit;
                    html += `<div class="unit-title">📂 ${currentUnit} Curriculum</div><ul class="links-grid">`;
                }
                let formattedId = id < 10 ? '0' + id : id;
                html += `<li><a href="#topic${id}"><span>[${formattedId}]</span> ${item.title}</a></li>`;
                
                if (i === syllabus.length - 1 || syllabus[i+1].unit !== currentUnit) {
                    html += `</ul>`;
                }
            }

            html += `
                <div class="action-bar">
                    <button class="btn pdf-btn" onclick="window.print();">📥 Export Complete Syllabus (PDF)</button>
                </div>
                <div class="thank-you">⚡ SYSTEM STATUS: 100% ONLINE & STABLE</div>
                <div class="creator-tag">✨ Created by Palak Gupta</div>
            `;
            container.innerHTML = html;
        } else {
            // Render Detail Page
            let item = syllabus[topicId - 1];
            let formattedId = topicId < 10 ? '0' + topicId : topicId;

            container.innerHTML = `
                <h1>BCA V Semester: .NET Programming (CASC-14T)</h1>
                <div class="subtitle">📖 ${item.unit} // MODULE [${formattedId}]: ${item.title}</div>

                <h2>1. विस्तृत परिभाषा, परिचय एवं दीर्घ उत्तरीय व्याख्या (Comprehensive Definition)</h2>
                <p>यह टॉपिक <strong>Sant Gahira Guru Vishwavidyalaya</strong> के बीसीए पंचम सेमेस्टर (सत्र 2024-28) के आधिकारिक पाठ्यक्रम <strong>CASC-14T (.NET Programming)</strong> के अंतर्गत एक अति महत्वपूर्ण और मूल आधार स्तंभ है[span_1](start_span)[span_1](end_span). विश्वविद्यालय की मुख्य परीक्षाओं में इस खंड से नियमित रूप से 15 अंकों के दीर्घ उत्तरीय प्रश्न पूछे जाते हैं। इस मॉड्यूल का मुख्य उद्देश्य छात्रों को .NET फ्रेमवर्क की आंतरिक संरचना, प्रबंधित निष्पादन वातावरण (CLR), ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग, विंडोज फॉर्म्स GUI डिजाइनिंग, और ADO.NET डेटाबेस कनेक्टिविटी की गहरी समझ प्रदान करना है।</p>

                <h2>2. वास्तुकला, संरचना एवं ग्राफिकल प्रवाह आरेख (Graphical Architecture Schema)</h2>
                <div class="diagram-container">
                    <div class="flow-box">1. User Source Code & GUI Logic (C# / VB.NET)</div>
                    <div class="flow-arrow">↓</div>
                    <div class="flow-box process">2. Language Compiler (Roslyn -> MSIL Binary & Metadata)</div>
                    <div class="flow-arrow">↓</div>
                    <div class="flow-box process">3. CLR Verification & JIT Native Compilation</div>
                </div>

                <h2>3. मुख्य विशेषताएं, घटक एवं लाइब्रेरीज (Components & Libraries)</h2>
                <ul>
                    <li><code>System</code>: Core data types aur console I/O ke liye.</li>
                    <li><code>System.Windows.Forms</code>: Windows-based GUI aur controls banane ke liye.</li>
                    <li><code>System.Data.SqlClient</code>: SQL Server database connectivity ke liye.</li>
                </ul>

                <h2>4. तुलनात्मक तालिका (Comparison Table)</h2>
                <table>
                    <tr>
                        <th>Parameters</th>
                        <th>Traditional C/C++</th>
                        <th>Modern .NET Framework</th>
                    </tr>
                    <tr>
                        <td>Memory</td>
                        <td>Manual (malloc/free)</td>
                        <td>Automatic Garbage Collection</td>
                    </tr>
                </table>

                <h2>5. लाभ एवं सीमाएं (Pros & Limitations)</h2>
                <h3>प्रमुख लाभ:</h3>
                <ul>
                    <li>High development productivity and pre-built FCL libraries.</li>
                    <li>Robust security via Code Access Security (CAS).</li>
                </ul>

                <h2>6. लाइव कोडिंग एवं प्रैक्टिकल (Live Code Testing)</h2>
                <code>
using System;
namespace SyllabusPortal {
    class Program {
        static void Main() {
            Console.WriteLine("Module ${topicId}: Executed Successfully.");
        }
    }
}
                </code>

                <h2>7. परीक्षा के लिए महत्वपूर्ण प्रश्न (Important Exam Questions)</h2>
                <div class="qa-box">
                    <h4>Q1: Explain the architecture of .NET Framework.</h4>
                    <p><strong>Answer:</strong> It consists of CLR, FCL, supporting languages, and application models providing a managed environment.</p>
                </div>

                <div class="action-bar">
                    <a href="#" class="btn">🏠 Return to Syllabus Hub</a>
                    <button class="btn pdf-btn" onclick="window.print();">📥 Print / Export PDF Notes</button>
                </div>

                <div class="thank-you">⚡ OFFICIAL SYLLABUS PORTAL // BCA V SEMESTER</div>
                <div class="creator-tag">✨ Created by Palak Gupta</div>
            `;
        }
    }

    window.addEventListener('hashchange', renderPage);
    window.addEventListener('load', renderPage);
</script>

</body>
</html>
